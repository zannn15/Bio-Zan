<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZN.AI — Beta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --violet: #8b5cf6;
    --violet-light: #a78bfa;
    --violet-dim: #6d28d9;
    --violet-glow: rgba(139,92,246,0.25);
    --violet-subtle: rgba(139,92,246,0.08);

    /* Dark theme */
    --bg: #09090f;
    --surface: #111118;
    --surface2: #1a1a2a;
    --surface3: #222235;
    --border: rgba(139,92,246,0.18);
    --text: #f1f0ff;
    --text-muted: #8b8aaa;
    --text-dim: #5a5870;
    --user-bubble: linear-gradient(135deg, #7c3aed, #8b5cf6);
    --ai-bubble: #111118;
    --scrollbar: rgba(139,92,246,0.2);
    --shadow: 0 8px 32px rgba(0,0,0,0.6);
    --input-bg: #13131f;
    --code-bg: #0d0d1a;
  }

  [data-theme="light"] {
    --bg: #f5f4ff;
    --surface: #ffffff;
    --surface2: #f0effe;
    --surface3: #e8e6fd;
    --border: rgba(139,92,246,0.2);
    --text: #1a1730;
    --text-muted: #6b6488;
    --text-dim: #9b95b8;
    --user-bubble: linear-gradient(135deg, #7c3aed, #8b5cf6);
    --ai-bubble: #ffffff;
    --scrollbar: rgba(139,92,246,0.3);
    --shadow: 0 8px 32px rgba(100,80,200,0.1);
    --input-bg: #ffffff;
    --code-bg: #1e1b4b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* ── Canvas particles ── */
  #particles {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0.35;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 10;
    transition: transform 0.3s ease, background 0.3s;
    position: relative;
  }

  .sidebar-logo {
    padding: 20px 18px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--violet-dim), var(--violet));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 16px var(--violet-glow);
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--violet-light), #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  .logo-badge {
    font-size: 9px;
    background: var(--violet-subtle);
    border: 1px solid var(--border);
    color: var(--violet-light);
    padding: 2px 6px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: auto;
  }

  .new-chat-btn {
    margin: 12px 12px 8px;
    padding: 10px 14px;
    background: var(--violet-subtle);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--violet-light);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    font-family: inherit;
    width: calc(100% - 24px);
  }

  .new-chat-btn:hover {
    background: rgba(139,92,246,0.18);
    border-color: var(--violet);
    box-shadow: 0 0 12px var(--violet-glow);
  }

  .sidebar-section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 8px 16px 4px;
  }

  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
  }

  .history-item {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-muted);
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .history-item:hover { background: var(--surface2); color: var(--text); }
  .history-item.active {
    background: var(--violet-subtle);
    color: var(--violet-light);
    border-left: 2px solid var(--violet);
    padding-left: 8px;
  }

  .history-item svg { flex-shrink: 0; opacity: 0.6; }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-toggle {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: inherit;
    font-weight: 500;
    transition: all 0.2s;
  }

  .theme-toggle:hover { border-color: var(--violet); color: var(--text); }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
    z-index: 1;
  }

  /* ── Top bar ── */
  .topbar {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 5;
  }

  .menu-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    transition: color 0.2s;
  }

  .menu-btn:hover { color: var(--text); }

  .model-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.2s;
    position: relative;
    user-select: none;
  }

  .model-selector:hover { border-color: var(--violet); color: var(--text); }

  .model-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px #10b981;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .model-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    min-width: 200px;
    overflow: hidden;
    box-shadow: var(--shadow);
    z-index: 100;
  }

  .model-dropdown.open { display: block; }

  .model-option {
    padding: 10px 14px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .model-option:hover { background: var(--surface2); color: var(--text); }
  .model-option.selected { color: var(--violet-light); }

  .topbar-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    text-align: center;
  }

  .topbar-actions {
    display: flex;
    gap: 6px;
    margin-left: auto;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: none;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    background: var(--surface2);
    border-color: var(--border);
    color: var(--text);
  }

  /* ── Chat Area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar) transparent;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

  /* Welcome screen */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    padding: 40px 20px;
    gap: 16px;
  }

  .welcome-orb {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--violet-dim), var(--violet));
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 40px var(--violet-glow), 0 0 80px rgba(139,92,246,0.12);
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .welcome h2 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--text), var(--violet-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .welcome p {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 380px;
    line-height: 1.6;
  }

  .welcome-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 440px;
    margin-top: 8px;
  }

  .chip {
    padding: 8px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12.5px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .chip:hover {
    background: var(--violet-subtle);
    border-color: var(--violet);
    color: var(--violet-light);
  }

  /* ── Message ── */
  .msg-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }

  .msg-avatar.ai {
    background: linear-gradient(135deg, var(--violet-dim), var(--violet));
    box-shadow: 0 0 10px var(--violet-glow);
    font-size: 16px;
  }

  .msg-avatar.user {
    background: var(--surface3);
    color: var(--text-muted);
    font-size: 12px;
  }

  .msg-content {
    flex: 1;
    min-width: 0;
  }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .msg-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .msg-time {
    font-size: 10.5px;
    color: var(--text-dim);
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
    word-break: break-word;
  }

  .msg-row.ai .msg-bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
    color: var(--text);
  }

  .msg-row.user .msg-bubble {
    background: var(--user-bubble);
    color: #fff;
    border-radius: 14px 4px 14px 14px;
    box-shadow: 0 4px 20px rgba(139,92,246,0.35);
  }

  /* ── Thinking block ── */
  .thinking-block {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface2);
  }

  .thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: var(--violet-light);
    user-select: none;
    transition: background 0.15s;
  }

  .thinking-header:hover { background: var(--violet-subtle); }

  .thinking-spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--violet-subtle);
    border-top-color: var(--violet);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  .thinking-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--violet);
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .thinking-chevron {
    margin-left: auto;
    transition: transform 0.25s;
  }

  .thinking-chevron.open { transform: rotate(180deg); }

  .thinking-body {
    display: none;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    font-style: italic;
  }

  .thinking-body.open { display: block; }

  /* ── Loading dots ── */
  .loading-dots {
    display: flex;
    gap: 5px;
    padding: 4px 0;
  }

  .loading-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--violet);
    animation: bounce 1.2s infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Code block ── */
  .code-block {
    margin: 10px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(139,92,246,0.25);
    font-family: 'JetBrains Mono', monospace;
  }

  .code-header {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    background: rgba(139,92,246,0.12);
    border-bottom: 1px solid rgba(139,92,246,0.15);
  }

  .code-lang {
    font-size: 11px;
    font-weight: 600;
    color: var(--violet-light);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .code-copy {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 9px;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .code-copy:hover { border-color: var(--violet); color: var(--violet-light); }

  .code-body {
    background: var(--code-bg);
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;
    color: #c4b5fd;
    white-space: pre;
  }

  /* ── Input area ── */
  .input-area {
    padding: 12px 20px 10px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-wrapper {
    max-width: 780px;
    margin: 0 auto;
  }

  .input-box {
    display: flex;
    align-items: flex-end;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    gap: 8px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-box:focus-within {
    border-color: var(--violet);
    box-shadow: 0 0 0 3px var(--violet-glow);
  }

  #promptInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: none;
    line-height: 1.5;
    max-height: 160px;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  #promptInput::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--violet-dim), var(--violet));
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 2px 12px rgba(139,92,246,0.4);
  }

  .send-btn:hover { transform: scale(1.06); box-shadow: 0 4px 18px rgba(139,92,246,0.55); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .input-footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 7px;
  }

  /* ── Inline formatting ── */
  .msg-bubble strong { font-weight: 700; }
  .msg-bubble em { font-style: italic; }
  .msg-bubble code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    background: rgba(139,92,246,0.15);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--violet-light);
  }

  /* Typing cursor */
  .typing-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--violet);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.7s infinite;
  }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ── Mobile ── */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 9;
    backdrop-filter: blur(2px);
  }

  @media (max-width: 700px) {
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      z-index: 20;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .menu-btn { display: flex; }
    .topbar-title { display: block; }
    .chat-area { padding: 16px 12px 8px; }
    .input-area { padding: 10px 12px 8px; }
  }

  /* ── Scrollbar global ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">⚡</div>
    <span class="logo-text">ZN.AI</span>
    <span class="logo-badge">Beta</span>
  </div>

  <button class="new-chat-btn" onclick="newChat()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Chat Baru
  </button>

  <div class="sidebar-section-label">Riwayat</div>
  <div class="history-list" id="historyList">
    <!-- filled dynamically -->
  </div>

  <div class="sidebar-footer">
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="themeIcon">☀️</span>
      <span id="themeLabel">Mode Terang</span>
    </button>
  </div>
</aside>

<!-- ── MAIN ── -->
<div class="main">
  <!-- Topbar -->
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <!-- Model selector -->
    <div class="model-selector" onclick="toggleModelDropdown()" id="modelSelector">
      <div class="model-dot"></div>
      <span id="modelName">llama-3.3-70b-versatile</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="model-dropdown" id="modelDropdown">
        <div class="model-option selected" onclick="selectModel('llama-3.3-70b-versatile')">⚡ llama-3.3-70b-versatile</div>
        <div class="model-option" onclick="selectModel('llama3-70b-8192')">🧠 llama3-70b-8192</div>
        <div class="model-option" onclick="selectModel('mixtral-8x7b-32768')">🔀 mixtral-8x7b-32768</div>
        <div class="model-option" onclick="selectModel('gemma2-9b-it')">💎 gemma2-9b-it</div>
      </div>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" onclick="clearChat()" title="Hapus chat">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-orb">⚡</div>
      <h2>Selamat datang di ZN.AI</h2>
      <p>Asisten AI futuristik berbasis Groq. Tanyakan apa saja — saya siap membantu.</p>
      <div class="welcome-chips">
        <button class="chip" onclick="useChip(this)">Buatkan kode Python sederhana</button>
        <button class="chip" onclick="useChip(this)">Jelaskan Machine Learning</button>
        <button class="chip" onclick="useChip(this)">Tulis esai singkat tentang AI</button>
        <button class="chip" onclick="useChip(this)">Apa itu Quantum Computing?</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrapper">
      <div class="input-box">
        <textarea id="promptInput" rows="1" placeholder="Tanya ZN.AI sesuatu..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Kirim">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-footer">ZN.AI dapat melakukan kesalahan. Cek konfirmasi.</div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
// API Key diambil dari server Vercel via /api/chat
// Ganti endpoint sesuai Vercel deployment Anda
const VERCEL_ENDPOINT = '/api/chat'; // <-- Vercel serverless function
const GROQ_DIRECT_FALLBACK = true;   // fallback direct jika Vercel belum setup
// Untuk beta/demo: gunakan proxy sederhana
// ────────────────────────────────────────────────────────

let conversations = JSON.parse(localStorage.getItem('znai_convs') || '[]');
let currentId = null;
let currentModel = 'llama-3.3-70b-versatile';
let isGenerating = false;

// ── PARTICLES ────────────────────────────────────────────
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let pts = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function initParticles() {
  pts = [];
  const n = Math.floor((canvas.width * canvas.height) / 18000);
  for (let i = 0; i < n; i++) {
    pts.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.3,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      a: Math.random() * 0.5 + 0.1,
    });
  }
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  const color = isDark ? '139,92,246' : '109,40,217';

  pts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${color},${p.a})`;
    ctx.fill();
  });

  // lines between close particles
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 90) {
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = `rgba(${color},${0.07 * (1 - dist/90)})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawParticles);
}

window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
resizeCanvas(); initParticles(); drawParticles();

// ── THEME ────────────────────────────────────────────────
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
  document.getElementById('themeLabel').textContent = isDark ? 'Mode Gelap' : 'Mode Terang';
  localStorage.setItem('znai_theme', isDark ? 'light' : 'dark');
}

// Load saved theme
const savedTheme = localStorage.getItem('znai_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
if (savedTheme === 'light') {
  document.getElementById('themeIcon').textContent = '🌙';
  document.getElementById('themeLabel').textContent = 'Mode Gelap';
}

// ── SIDEBAR ──────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}

document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});

// ── MODEL ────────────────────────────────────────────────
let modelDropOpen = false;

function toggleModelDropdown(e) {
  modelDropOpen = !modelDropOpen;
  document.getElementById('modelDropdown').classList.toggle('open', modelDropOpen);
}

function selectModel(m) {
  currentModel = m;
  document.getElementById('modelName').textContent = m;
  document.querySelectorAll('.model-option').forEach(el => {
    el.classList.toggle('selected', el.textContent.includes(m));
  });
  modelDropOpen = false;
  document.getElementById('modelDropdown').classList.remove('open');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#modelSelector')) {
    document.getElementById('modelDropdown').classList.remove('open');
    modelDropOpen = false;
  }
});

// ── CONVERSATION MANAGEMENT ──────────────────────────────
function newChat() {
  currentId = crypto.randomUUID();
  conversations.unshift({ id: currentId, title: 'Chat Baru', messages: [], ts: Date.now() });
  saveConvs();
  renderHistory();
  clearChatUI();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

function saveConvs() {
  localStorage.setItem('znai_convs', JSON.stringify(conversations.slice(0, 40)));
}

function getConv() {
  return conversations.find(c => c.id === currentId);
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if (!conversations.length) {
    list.innerHTML = '<div style="padding:12px 16px;font-size:12px;color:var(--text-dim)">Belum ada riwayat.</div>';
    return;
  }
  conversations.forEach(c => {
    const el = document.createElement('div');
    el.className = 'history-item' + (c.id === currentId ? ' active' : '');
    el.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${escHtml(c.title)}`;
    el.onclick = () => loadConv(c.id);
    list.appendChild(el);
  });
}

function loadConv(id) {
  currentId = id;
  renderHistory();
  const conv = getConv();
  clearChatUI();
  if (conv && conv.messages.length) {
    document.getElementById('welcome').style.display = 'none';
    conv.messages.forEach(m => appendMessageStatic(m.role, m.content));
  }
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  scrollToBottom();
}

function clearChatUI() {
  const area = document.getElementById('chatArea');
  area.innerHTML = '<div class="welcome" id="welcome"><div class="welcome-orb">⚡</div><h2>Selamat datang di ZN.AI</h2><p>Asisten AI futuristik berbasis Groq. Tanyakan apa saja — saya siap membantu.</p><div class="welcome-chips"><button class="chip" onclick="useChip(this)">Buatkan kode Python sederhana</button><button class="chip" onclick="useChip(this)">Jelaskan Machine Learning</button><button class="chip" onclick="useChip(this)">Tulis esai singkat tentang AI</button><button class="chip" onclick="useChip(this)">Apa itu Quantum Computing?</button></div></div>';
}

function clearChat() {
  if (!currentId) return;
  conversations = conversations.filter(c => c.id !== currentId);
  saveConvs();
  currentId = null;
  renderHistory();
  clearChatUI();
}

// ── INIT ──────────────────────────────────────────────────
if (conversations.length) {
  currentId = conversations[0].id;
  renderHistory();
  if (conversations[0].messages.length) loadConv(currentId);
} else {
  newChat();
  renderHistory();
}

// ── INPUT ────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function useChip(btn) {
  document.getElementById('promptInput').value = btn.textContent;
  sendMessage();
}

// ── RENDER MARKDOWN ──────────────────────────────────────
function renderMd(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const l = lang || 'code';
    const escaped = escHtml(code.trim());
    return `<div class="code-block"><div class="code-header"><span class="code-lang">${l}</span><button class="code-copy" onclick="copyCode(this)">Salin</button></div><div class="code-body">${escaped}</div></div>`;
  });
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/_(.+?)_/g, '<em>$1</em>');
  // Newlines
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyCode(btn) {
  const code = btn.closest('.code-block').querySelector('.code-body').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Disalin!';
    setTimeout(() => btn.textContent = 'Salin', 1800);
  });
}

// ── SEND ─────────────────────────────────────────────────
async function sendMessage() {
  if (isGenerating) return;
  const input = document.getElementById('promptInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  isGenerating = true;

  // Hide welcome
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  // Save user message
  const conv = getConv();
  conv.messages.push({ role: 'user', content: text });
  if (conv.title === 'Chat Baru') {
    conv.title = text.slice(0, 42) + (text.length > 42 ? '…' : '');
  }
  saveConvs();
  renderHistory();

  // Append user bubble
  appendMessageStatic('user', text);
  scrollToBottom();

  // Append AI thinking + loading
  const aiRow = createAIRow();
  document.getElementById('chatArea').appendChild(aiRow);
  scrollToBottom();

  // Thinking block
  const thinkingDiv = aiRow.querySelector('.thinking-block');
  const thinkBody = aiRow.querySelector('.thinking-body');
  const thinkTexts = [
    'Memproses permintaan Anda…',
    'Menganalisis konteks percakapan…',
    'Menyusun respons terbaik…',
    'Mengoptimalkan jawaban…',
  ];
  let thinkIdx = 0;
  const thinkInterval = setInterval(() => {
    thinkBody.innerHTML = thinkTexts[thinkIdx % thinkTexts.length];
    thinkIdx++;
  }, 900);

  const bubbleEl = aiRow.querySelector('.msg-bubble');

  try {
    const responseText = await callGroq(conv.messages.slice(0, -1).concat({ role: 'user', content: text }));

    clearInterval(thinkInterval);
    // Mark thinking done
    thinkingDiv.querySelector('.thinking-spinner').style.display = 'none';
    const dot = document.createElement('div');
    dot.className = 'thinking-dot';
    thinkingDiv.querySelector('.thinking-header').prepend(dot);
    thinkBody.innerHTML = thinkTexts[Math.min(thinkIdx, thinkTexts.length - 1)];

    // Remove loading dots
    const loadingEl = bubbleEl.querySelector('.loading-dots');
    if (loadingEl) loadingEl.remove();

    // Typewriter
    await typeWriter(bubbleEl, responseText);

    // Save AI message
    conv.messages.push({ role: 'assistant', content: responseText });
    saveConvs();

  } catch (err) {
    clearInterval(thinkInterval);
    const loadingEl = bubbleEl.querySelector('.loading-dots');
    if (loadingEl) loadingEl.remove();
    bubbleEl.innerHTML = `<span style="color:#f87171">⚠️ Error: ${escHtml(err.message)}</span>`;
  }

  document.getElementById('sendBtn').disabled = false;
  isGenerating = false;
  scrollToBottom();
}

// ── TYPEWRITER ───────────────────────────────────────────
async function typeWriter(el, text) {
  el.innerHTML = '<span class="typing-cursor"></span>';
  const cursor = el.querySelector('.typing-cursor');
  let rendered = '';
  let i = 0;

  // Chunk by characters but render markdown in chunks
  while (i < text.length) {
    const chunk = text.slice(0, i + 1);
    rendered = chunk;
    const cursor2 = el.querySelector('.typing-cursor');
    el.innerHTML = renderMd(rendered);
    el.appendChild(createCursor());
    i++;
    const delay = text[i - 1] === '\n' ? 20 : (Math.random() * 12 + 6);
    await sleep(delay);
    scrollToBottom();
  }

  // Remove cursor at end
  const finalCursor = el.querySelector('.typing-cursor');
  if (finalCursor) finalCursor.remove();
  el.innerHTML = renderMd(text);
}

function createCursor() {
  const c = document.createElement('span');
  c.className = 'typing-cursor';
  return c;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── STATIC APPEND ────────────────────────────────────────
function appendMessageStatic(role, content) {
  const chatArea = document.getElementById('chatArea');
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

  if (role === 'user') {
    row.innerHTML = `
      <div class="msg-avatar user">Aku</div>
      <div class="msg-content">
        <div class="msg-meta">
          <span class="msg-name">Anda</span>
          <span class="msg-time">${now}</span>
        </div>
        <div class="msg-bubble">${escHtml(content)}</div>
      </div>`;
  } else {
    row.innerHTML = `
      <div class="msg-avatar ai">⚡</div>
      <div class="msg-content">
        <div class="msg-meta">
          <span class="msg-name" style="color:var(--violet-light)">ZN.AI</span>
          <span class="msg-time">${now}</span>
        </div>
        <div class="msg-bubble">${renderMd(content)}</div>
      </div>`;
  }
  chatArea.appendChild(row);
}

function createAIRow() {
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  row.innerHTML = `
    <div class="msg-avatar ai">⚡</div>
    <div class="msg-content">
      <div class="msg-meta">
        <span class="msg-name" style="color:var(--violet-light)">ZN.AI</span>
        <span class="msg-time">${now}</span>
      </div>
      <div class="thinking-block">
        <div class="thinking-header" onclick="toggleThinking(this)">
          <div class="thinking-spinner"></div>
          <span>•&nbsp;Sedang berpikir…</span>
          <svg class="thinking-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="thinking-body open">Memulai proses berpikir…</div>
      </div>
      <div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>
    </div>`;
  return row;
}

function toggleThinking(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.thinking-chevron');
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

// ── GROQ API ─────────────────────────────────────────────
async function callGroq(messages) {
  // Coba panggil Vercel API route dulu
  // Route: /api/chat (Anda buat di Vercel)
  // Jika belum ada, fallback ke error yang informatif

  const body = JSON.stringify({ messages, model: currentModel });

  let res;
  try {
    res = await fetch(VERCEL_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
  } catch (networkErr) {
    // Vercel endpoint tidak ada, tampilkan pesan setup
    throw new Error(
      'Endpoint /api/chat belum dikonfigurasi. ' +
      'Buat file api/chat.js di repo GitHub Anda dan deploy ke Vercel. ' +
      'Lihat komentar di kode untuk panduan.'
    );
  }

  if (!res.ok) {
    const errTxt = await res.text().catch(() => '');
    throw new Error(`Server error ${res.status}: ${errTxt}`);
  }

  const data = await res.json();
  return data.content || data.choices?.[0]?.message?.content || 'Tidak ada respons.';
}

// ── SCROLL ───────────────────────────────────────────────
function scrollToBottom() {
  const area = document.getElementById('chatArea');
  area.scrollTop = area.scrollHeight;
}
</script>
